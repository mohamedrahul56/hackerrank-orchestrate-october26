# Tooling configuration only (the package is run as `python3 code/main.py`, not installed). Setup: pip install -r code/requirements-dev.txt
# Run:  make lint   (ruff, then mypy)

[tool.ruff]
line-length = 200
target-version = "py312"

[tool.ruff.lint]
# F: pyflakes (unused imports and variables, undefined names), B: bugbear (likely bugs), E9: syntax errors.
select = ["F", "B", "E9"]
# B905 (zip without strict=): the zipped sequences here are built from the same rows and have equal length by construction; strict=True would only add a way to crash a run.
ignore = ["B905"]

[tool.mypy]
files = ["auditor", "main.py"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
